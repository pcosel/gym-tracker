<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>Gym Tracker</h1>
    <div id="account" hidden>
      <span id="account-email"></span>
      <button type="button" id="sign-out">Sign out</button>
    </div>
  </header>

  <p id="error" role="alert" hidden></p>

  <section id="screen-config" hidden>
    <h2>Not configured</h2>
    <p>These settings of the <strong id="config-name"></strong> configuration in <code>config.js</code> are still blank:</p>
    <ul id="missing-keys"></ul>
  </section>

  <section id="screen-signin" hidden>
    <p>Sign in to connect your gym spreadsheet.</p>
    <button type="button" id="sign-in">Sign in with Google</button>
  </section>

  <section id="screen-checking" hidden>
    <p id="checking-text">Loading…</p>
  </section>

  <section id="screen-denied" hidden>
    <h2>No access</h2>
    <p>
      <strong id="denied-email">This account</strong> cannot open the gym
      spreadsheet. It does not exist, or it is not shared with this account.
    </p>
    <button type="button" id="use-different-account">Use a different account</button>
  </section>

  <section id="screen-app" hidden>
    <h2 id="today-date"></h2>
    <p>Connected to: <strong id="sheet-title"></strong></p>
    <p id="tab-missing" hidden></p>
    <div id="workout" hidden>
      <div id="exercises"></div>
      <div class="add-exercise">
        <select id="add-select" aria-label="Add an exercise"></select>
      </div>
      <p id="save-status" role="status"></p>
      <button type="button" id="save-retry" hidden>Retry</button>
      <button type="button" id="save-signin" hidden>Sign in to save</button>
    </div>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
